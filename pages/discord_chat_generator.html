<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Discordチャットスクリーンショットジェネレータ</title>
<style>
  body {
    background: #36393f;
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }
  #app {
    max-width: 800px;
    margin: 0 auto;
  }
  #controls {
    margin-bottom: 16px;
    color: #fff;
    font-size: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  #controls label {
    margin-right: 4px;
  }
  #controls input[type="file"] {
    margin-right: 8px;
  }
  #controls button {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    background: #5865f2;
    color: #fff;
    cursor: pointer;
  }
  #controls button:hover {
    background: #4752c4;
  }

  .chat-container {
    background: #2f3136;
    border-radius: 8px;
    padding: 16px;
  }
  /* Message */
  .message {
    display: flex;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    background: #555;
    margin-right: 12px;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .message-content {
    flex: 1;
  }
  .message-header {
    display: flex;
    align-items: baseline;
  }
  .username {
    font-weight: bold;
    color: #fff;
    margin-right: 6px;
    outline: none;
  }
  .timestamp {
    font-size: 12px;
    color: #72767d;
    outline: none;
  }
  .message-text {
    color: #dcddde;
    margin-top: 2px;
    white-space: pre-wrap;
    line-height: 1.4;
    outline: none;
  }
  .message-text a {
    color: #00aff4;
    text-decoration: none;
  }
  /* Embed */
  .embed {
    display: flex;
    margin-top: 8px;
    border-left: 4px solid #00aaff;
    background: #2b2d31;
    border-radius: 4px;
    overflow: hidden;
  }
  .embed-content {
    padding: 12px;
    flex: 1;
  }
  .embed-title {
    font-size: 14px;
    font-weight: 600;
    color: #00aff4;
    margin-bottom: 4px;
    outline: none;
  }
  .embed-description {
    font-size: 13px;
    color: #b9bbbe;
    line-height: 1.4;
    margin-bottom: 4px;
    outline: none;
  }
  .embed-extra {
    font-size: 12px;
    color: #b9bbbe;
    outline: none;
  }
  .embed-image {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    background: #444;
  }
  .embed-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Input bar */
  .input-bar {
    display: flex;
    align-items: center;
    margin-top: 20px;
    background: #40444b;
    border-radius: 8px;
    padding: 8px;
    color: #b9bbbe;
  }
  .channel-placeholder {
    margin-right: auto;
    padding-left: 8px;
    font-size: 14px;
  }
  .input-bar-icons {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 18px;
  }
  .input-bar-icons span {
    cursor: pointer;
  }

</style>
</head>
<body>
  <div id="app">
    <div id="controls">
      <input type="file" id="avatarInput" accept="image/*" />
      <label for="avatarInput">アバター画像</label>
      <input type="file" id="embedImageInput" accept="image/*" />
      <label for="embedImageInput">埋め込み画像</label>
    </div>
    <div class="chat-container">
      <div class="message">
        <div class="avatar">
          <img id="avatarImage" src="" alt="avatar" />
        </div>
        <div class="message-content">
          <div class="message-header">
            <span class="username" id="username" contenteditable="true" spellcheck="false">ユーザー名</span>
            <span class="timestamp" id="timestamp" contenteditable="true" spellcheck="false">昨日 23:00</span>
          </div>
          <div class="message-text" id="messageText" contenteditable="true" spellcheck="false">ここにメッセージを入力してください。URLを含めるとリンク風に表示されます。</div>
          <!-- Embed -->
          <div class="embed" id="embed">
            <div class="embed-content">
              <div class="embed-title" id="embedTitle" contenteditable="true" spellcheck="false">埋め込みタイトルを入力</div>
              <div class="embed-description" id="embedDescription" contenteditable="true" spellcheck="false">埋め込みの説明を入力してください。長いテキストもOKです。</div>
              <div class="embed-extra" id="embedExtra" contenteditable="true" spellcheck="false">追加情報や評価など</div>
            </div>
            <div class="embed-image">
              <img id="embedImage" src="" alt="embed" />
            </div>
          </div>
        </div>
      </div>
      <!-- Input bar -->
      <div class="input-bar">
        <span class="channel-placeholder" contenteditable="true">#一般へメッセージを送信</span>
        <div class="input-bar-icons">
          <span>🎁</span>
          <span>GIF</span>
          <span>😊</span>
          <span>📎</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Avatar upload handler
    document.getElementById("avatarInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        document.getElementById("avatarImage").src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
    // Embed image upload handler
    document.getElementById("embedImageInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        document.getElementById("embedImage").src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
    // Link detection: color URLs in the message text (simple)
    const msg = document.getElementById('messageText');
    function updateLinks() {
      // Replace http(s) links with anchor tags (basic)
      let text = msg.innerText;
      // simple regex for URLs
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const replaced = text.replace(urlRegex, function(url) {
        return '<a href="' + url + '">' + url + '</a>';
      });
      msg.innerHTML = replaced;
      placeCaretAtEnd(msg);
    }
    function placeCaretAtEnd(el) {
      el.focus();
      document.getSelection().collapse(el, el.childNodes.length);
    }
    msg.addEventListener('blur', updateLinks);
  </script>
</body>
</html>
